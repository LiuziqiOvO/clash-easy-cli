[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "clash-cli"
version = "1.0.0"
description = "Modern Python CLI for Clash proxy management"
authors = ["AI Assistant <ai@example.com>"]
readme = "README.md"
packages = [{include = "clash_cli"}]

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
click = "^8.1.0"
httpx = "^0.24.0"
pydantic = "^2.0.0"
loguru = "^0.7.0"
psutil = "^5.9.0"
rich = "^13.0.0"
pyyaml = "^6.0.0"
toml = "^0.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[tool.poetry.scripts]
clash-cli = "clash_cli.main:main"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true 